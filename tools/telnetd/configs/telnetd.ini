; telnetd.ini - dmdevfs driver configuration.
;
; Drop into dmdevfs's scanned config directory (see dmdevfs's own
; docs/README.md "Configuration Files" section) to have telnetd loaded and
; enabled at boot, listening for incoming Telnet connections on `port`.
;
; On dmod-boot, this is a "driver=" entry in flash.dmd, e.g.:
;   telnetd driver=telnetd.ini
[main]
driver_name=telnetd
port=23
; Loaded after SDRAM (dmfmc) comes online: telnetd pulls in dmtcp, dm_sw_ring,
; dmini, dmhaman and dmtelnet, which need more room than the small internal
; heap that's all that exists before SDRAM is configured.
driver_order=5
